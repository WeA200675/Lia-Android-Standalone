name: Android build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Validate pinned wrapper and run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK with native runtime
        run: ./gradlew assembleDebug --no-daemon
      - name: Generate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lia-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
